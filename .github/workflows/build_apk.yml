name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'

      - name: Create Flutter Project & Inject Code
        run: |
          # إنشاء مشروع جديد مؤقت بنفس اسم الحزمة
          flutter create . --org com.quran.checker --project-name quran_checker --platforms=android
          
          # نسخ الكود البرمجي الخاص بنا إلى مكانه الصحيح
          # (تأكد أن ملف main.dart و pubspec.yaml مرفوعان في الجذر الرئيسي لمستودعك)
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
